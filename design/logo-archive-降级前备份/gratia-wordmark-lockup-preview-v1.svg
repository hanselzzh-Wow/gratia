<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1600" width="1600" height="1600">
  <rect width="1600" height="1600" fill="#FFFFFF"/>

  <text x="100" y="110" font-family="Avenir Next, Helvetica Neue, sans-serif" font-size="42" font-weight="600" fill="#2A2024">Gratia · 品牌字标组合首稿</text>
  <text x="100" y="158" font-family="PingFang SC, Helvetica Neue, sans-serif" font-size="22" font-weight="400" fill="#826D76">英文主标 / 中文主标 · Horizontal Lockups</text>

  <!-- English-primary lockup -->
  <g transform="translate(100 240)">
    <rect width="1400" height="520" rx="38" fill="#FAF4F6"/>
    <text x="54" y="62" font-family="Avenir Next, Helvetica Neue, sans-serif" font-size="20" font-weight="600" letter-spacing="2" fill="#9A7F89">ENGLISH PRIMARY</text>

    <!-- Refined symbol, scaled without changing geometry -->
    <g transform="translate(38 84) scale(.38)">
      <path d="M206 634 C366 728 606 674 772 430" fill="none" stroke="#9A536D" stroke-width="60" stroke-linecap="round"/>
      <circle cx="206" cy="634" r="58" fill="#9A536D"/>
      <circle cx="772" cy="430" r="104" fill="#9A536D"/>
    </g>

    <!-- Humanist wordmark: compact spacing, soft terminals, custom accent dot -->
    <text x="430" y="310" font-family="Avenir Next, Helvetica Neue, sans-serif" font-size="188" font-weight="600" letter-spacing="-5" fill="#2A2024">Gratia</text>
    <circle cx="838" cy="164" r="11" fill="#9A536D"/>
    <path d="M434 354 C590 372 780 370 956 344" fill="none" stroke="#E4C6D0" stroke-width="10" stroke-linecap="round"/>
    <text x="438" y="414" font-family="PingFang SC, Helvetica Neue, sans-serif" font-size="39" font-weight="500" letter-spacing="12" fill="#705E66">哈喽卧得</text>
  </g>

  <!-- Chinese-primary reverse lockup -->
  <g transform="translate(100 830)">
    <rect width="1400" height="520" rx="38" fill="#9A536D"/>
    <text x="54" y="62" font-family="Avenir Next, Helvetica Neue, sans-serif" font-size="20" font-weight="600" letter-spacing="2" fill="#EACFD8">CHINESE PRIMARY / REVERSE</text>

    <g transform="translate(38 84) scale(.38)">
      <path d="M206 634 C366 728 606 674 772 430" fill="none" stroke="#FFFFFF" stroke-width="60" stroke-linecap="round"/>
      <circle cx="206" cy="634" r="58" fill="#FFFFFF"/>
      <circle cx="772" cy="430" r="104" fill="#FFFFFF"/>
    </g>

    <!-- Chinese spacing follows the symbol's open, friendly rhythm -->
    <text x="430" y="296" font-family="PingFang SC, Helvetica Neue, sans-serif" font-size="145" font-weight="600" letter-spacing="12" fill="#FFFFFF">哈喽卧得</text>
    <path d="M434 342 C610 362 828 356 1024 324" fill="none" stroke="#E4C6D0" stroke-width="10" stroke-linecap="round" opacity=".9"/>
    <text x="438" y="414" font-family="Avenir Next, Helvetica Neue, sans-serif" font-size="42" font-weight="600" letter-spacing="15" fill="#F3E4E9">GRATIA</text>
  </g>

  <text x="100" y="1450" font-family="PingFang SC, Helvetica Neue, sans-serif" font-size="22" fill="#826D76">概念：远方的两个人，由一条温柔上扬的路径连接；字标采用人文无衬线与舒展字距，避免公益化和儿童化。</text>
</svg>
