<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1400" width="1600" height="1400">
  <rect width="1600" height="1400" fill="#FDFCFB"/>

  <!-- English-primary: mature humanist skeleton + restrained brand modifications -->
  <g transform="translate(80 90)">
    <rect width="1440" height="550" rx="46" fill="#FAF4F6"/>

    <g transform="translate(72 80) scale(.43)" fill="#8F3F60" stroke="#8F3F60">
      <path d="M300 730 Q470 640 560 520 T705 330" fill="none" stroke-width="88" stroke-linecap="round"/>
      <circle cx="300" cy="730" r="62" stroke="none"/>
      <circle cx="705" cy="330" r="112" stroke="none"/>
    </g>

    <!-- Avenir Next is the base; spacing is optically tuned per glyph. -->
    <text x="470" y="318" font-family="Avenir Next, Avenir, sans-serif" font-size="190" font-weight="500" fill="#291D22">
      <tspan>G</tspan><tspan dx="-8">r</tspan><tspan dx="-4">a</tspan><tspan dx="-8">t</tspan><tspan dx="-9">i</tspan><tspan dx="-6">a</tspan>
    </text>

    <!-- Replace the library i-dot with the exact circular-node language of the symbol. -->
    <circle cx="861" cy="191" r="24" fill="#FAF4F6"/>
    <circle cx="861" cy="191" r="13" fill="#8F3F60"/>

    <text x="480" y="432" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="45" font-weight="500" letter-spacing="9" fill="#735F67">哈喽卧得</text>
  </g>

  <!-- Chinese-primary reverse: the two mouth radicals become the ownable signature. -->
  <g transform="translate(80 750)">
    <rect width="1440" height="550" rx="46" fill="#8F3F60"/>

    <g transform="translate(72 80) scale(.43)" fill="#FFFFFF" stroke="#FFFFFF">
      <path d="M300 730 Q470 640 560 520 T705 330" fill="none" stroke-width="88" stroke-linecap="round"/>
      <circle cx="300" cy="730" r="62" stroke="none"/>
      <circle cx="705" cy="330" r="112" stroke="none"/>
    </g>

    <!-- Mature Chinese base with optical per-character spacing. -->
    <text x="470" y="320" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="150" font-weight="600" fill="#FFFFFF">
      <tspan>哈</tspan><tspan dx="8">喽</tspan><tspan dx="10">卧</tspan><tspan dx="6">得</tspan>
    </text>

    <!-- Remove and rebuild only the two 口 radicals as softer connected-person forms. -->
    <rect x="468" y="185" width="58" height="142" fill="#8F3F60"/>
    <rect x="480" y="219" width="34" height="78" rx="15" fill="none" stroke="#F3DCE5" stroke-width="12"/>
    <rect x="628" y="185" width="58" height="142" fill="#8F3F60"/>
    <rect x="640" y="219" width="34" height="78" rx="15" fill="none" stroke="#F3DCE5" stroke-width="12"/>

    <text x="482" y="432" font-family="Avenir Next, Avenir, sans-serif" font-size="54" font-weight="500" letter-spacing="6" fill="#F4DEE7">Gratia</text>
    <!-- English secondary i-dot gets the same node treatment. -->
    <circle cx="595" cy="391" r="10" fill="#8F3F60"/>
    <circle cx="595" cy="391" r="6" fill="#F3DCE5"/>
  </g>
</svg>
