<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1400" width="1600" height="1400">
  <rect width="1600" height="1400" fill="#FDFCFB"/>

  <!-- English-primary standard version -->
  <g transform="translate(80 90)">
    <rect width="1440" height="550" rx="46" fill="#FAF4F6"/>

    <g transform="translate(72 78) scale(.43)" fill="#8F3F60" stroke="#8F3F60">
      <path d="M300 730 Q470 640 560 520 T705 330" fill="none" stroke-width="88" stroke-linecap="round"/>
      <circle cx="300" cy="730" r="62" stroke="none"/><circle cx="705" cy="330" r="112" stroke="none"/>
    </g>

    <!-- Optima base, split so the i can become a true custom glyph. -->
    <text x="470" y="320" font-family="Optima, Palatino, serif" font-size="190" font-weight="500" letter-spacing="-3" fill="#291D22">Grat</text>

    <!-- Bespoke i: subtly tapered stem + node dot from the symbol geometry. -->
    <path d="M832 218 L854 216 L858 320 L827 320 Z" fill="#291D22"/>
    <circle cx="843" cy="184" r="13" fill="#8F3F60"/>

    <text x="872" y="320" font-family="Optima, Palatino, serif" font-size="190" font-weight="500" fill="#291D22">a</text>

    <!-- Chinese secondary: restrained weight and optical spacing. -->
    <text x="480" y="430" font-family="Hiragino Sans GB, PingFang SC, sans-serif" font-size="44" font-weight="500" fill="#735F67">
      <tspan>哈</tspan><tspan dx="8">喽</tspan><tspan dx="10">卧</tspan><tspan dx="7">得</tspan>
    </text>
  </g>

  <!-- Chinese-primary reverse version -->
  <g transform="translate(80 750)">
    <rect width="1440" height="550" rx="46" fill="#8F3F60"/>

    <g transform="translate(72 78) scale(.43)" fill="#FFFFFF" stroke="#FFFFFF">
      <path d="M300 730 Q470 640 560 520 T705 330" fill="none" stroke-width="88" stroke-linecap="round"/>
      <circle cx="300" cy="730" r="62" stroke="none"/><circle cx="705" cy="330" r="112" stroke="none"/>
    </g>

    <!-- Four glyphs are independently sized and placed for even colour and rhythm. -->
    <text x="470" y="310" font-family="Hiragino Sans GB, PingFang SC, sans-serif" font-size="141" font-weight="500" fill="#FFFFFF">哈</text>
    <text x="619" y="310" font-family="Hiragino Sans GB, PingFang SC, sans-serif" font-size="139" font-weight="500" fill="#FFFFFF">喽</text>
    <text x="769" y="310" font-family="Hiragino Sans GB, PingFang SC, sans-serif" font-size="144" font-weight="500" fill="#FFFFFF">卧</text>
    <text x="922" y="310" font-family="Hiragino Sans GB, PingFang SC, sans-serif" font-size="141" font-weight="500" fill="#FFFFFF">得</text>

    <!-- Secondary English repeats the exact same modified wordmark logic. -->
    <text x="480" y="438" font-family="Optima, Palatino, serif" font-size="64" font-weight="500" letter-spacing="-1" fill="#F5E5EB">Grat</text>
    <path d="M602 402 L610 401 L611 438 L600 438 Z" fill="#F5E5EB"/>
    <circle cx="606" cy="390" r="5" fill="#E9BFD0"/>
    <text x="617" y="438" font-family="Optima, Palatino, serif" font-size="64" font-weight="500" fill="#F5E5EB">a</text>
  </g>
</svg>
