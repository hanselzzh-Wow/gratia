<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1600" width="1600" height="1600">
  <rect width="1600" height="1600" fill="#FDFCFB"/>

  <!-- Direction A: humanist sans -->
  <g transform="translate(90 90)">
    <rect width="1420" height="420" rx="36" fill="#FAF4F6"/>
    <g transform="translate(55 28) scale(.37)" fill="#8F3F60" stroke="#8F3F60">
      <path d="M300 730 Q470 640 560 520 T705 330" fill="none" stroke-width="88" stroke-linecap="round"/>
      <circle cx="300" cy="730" r="62" stroke="none"/><circle cx="705" cy="330" r="112" stroke="none"/>
    </g>
    <text x="390" y="245" font-family="Avenir Next, Avenir, sans-serif" font-size="170" font-weight="500" letter-spacing="-5" fill="#291D22">Gratia</text>
    <text x="400" y="330" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="42" font-weight="500" letter-spacing="8" fill="#765F68">哈喽卧得</text>
  </g>

  <!-- Direction B: flared humanist -->
  <g transform="translate(90 590)">
    <rect width="1420" height="420" rx="36" fill="#FAF4F6"/>
    <g transform="translate(55 28) scale(.37)" fill="#8F3F60" stroke="#8F3F60">
      <path d="M300 730 Q470 640 560 520 T705 330" fill="none" stroke-width="88" stroke-linecap="round"/>
      <circle cx="300" cy="730" r="62" stroke="none"/><circle cx="705" cy="330" r="112" stroke="none"/>
    </g>
    <text x="390" y="245" font-family="Optima, Palatino, serif" font-size="170" font-weight="500" letter-spacing="-2" fill="#291D22">Gratia</text>
    <text x="400" y="330" font-family="Hiragino Sans GB, PingFang SC, sans-serif" font-size="42" font-weight="300" letter-spacing="8" fill="#765F68">哈喽卧得</text>
  </g>

  <!-- Direction C: editorial serif -->
  <g transform="translate(90 1090)">
    <rect width="1420" height="420" rx="36" fill="#FAF4F6"/>
    <g transform="translate(55 28) scale(.37)" fill="#8F3F60" stroke="#8F3F60">
      <path d="M300 730 Q470 640 560 520 T705 330" fill="none" stroke-width="88" stroke-linecap="round"/>
      <circle cx="300" cy="730" r="62" stroke="none"/><circle cx="705" cy="330" r="112" stroke="none"/>
    </g>
    <text x="390" y="245" font-family="New York, Georgia, serif" font-size="170" font-weight="400" letter-spacing="-6" fill="#291D22">Gratia</text>
    <text x="400" y="330" font-family="Songti SC, Songti TC, serif" font-size="42" font-weight="400" letter-spacing="8" fill="#765F68">哈喽卧得</text>
  </g>
</svg>
