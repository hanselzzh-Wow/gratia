<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1400" width="1400" height="1400">
  <rect width="1400" height="1400" fill="#FFFFFF"/>

  <!-- Single-colour lockup: symbol and wordmark behave as one mark. -->
  <!-- Symbol is optically 8% taller than the cap height to compensate for its narrow diagonal mass. -->
  <g transform="translate(190 493) scale(.34)" fill="#8F3F60" stroke="#8F3F60">
    <path d="M300 730 Q470 640 560 520 T705 330"
          fill="none" stroke-width="88" stroke-linecap="round"/>
    <circle cx="300" cy="730" r="62" stroke="none"/>
    <circle cx="705" cy="330" r="112" stroke="none"/>
  </g>

  <!-- Mature humanist base; exact word spacing is optically tuned glyph by glyph. -->
  <text x="500" y="760"
        font-family="Avenir Next, Avenir, sans-serif"
        font-size="220" font-weight="600"
        fill="#8F3F60">
    <tspan>G</tspan><tspan dx="-7">r</tspan><tspan dx="-4">a</tspan><tspan dx="-8">t</tspan><tspan dx="-7">i</tspan><tspan dx="-5">a</tspan>
  </text>
</svg>
