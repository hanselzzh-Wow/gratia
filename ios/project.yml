name: Gratia
options:
  bundleIdPrefix: com.hanselzzh
packages:
  GratiaCore:
    path: Packages/GratiaCore
targets:
  Gratia:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Gratia
    dependencies:
      - package: GratiaCore
    settings:
      base:
        INFOPLIST_FILE: Gratia/Info.plist
        CODE_SIGN_ENTITLEMENTS: Gratia/Gratia.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.hanselzzh.gratia
        # 仅 iPhone。1.0 的设计冻结稿、导航与截图均只针对 iPhone，从未做过
        # iPad 布局；若声明为通用，App Store 会要求为 iPad 多任务补齐四个
        # 方向（上传即被 90474 拒绝），等于把未适配的布局推给 iPad 用户。
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 5
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  GratiaTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: GratiaTests
    dependencies:
      - target: Gratia
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
