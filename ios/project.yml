name: Gratia
options:
  bundleIdPrefix: com.hanselzzh
packages:
  GratiaCore:
    path: Packages/GratiaCore
targets:
  Gratia:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Gratia
    dependencies:
      - package: GratiaCore
    settings:
      base:
        INFOPLIST_FILE: Gratia/Info.plist
        CODE_SIGN_ENTITLEMENTS: Gratia/Gratia.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.hanselzzh.gratia
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  GratiaTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: GratiaTests
    dependencies:
      - target: Gratia
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
