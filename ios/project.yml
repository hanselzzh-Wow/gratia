name: Haluowode
options:
  bundleIdPrefix: com.hanselzzh
packages:
  HaluowodeCore:
    path: Packages/HaluowodeCore
targets:
  Haluowode:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Haluowode
    dependencies:
      - package: HaluowodeCore
    settings:
      base:
        INFOPLIST_FILE: Haluowode/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.hanselzzh.haluowode
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  HaluowodeTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: HaluowodeTests
    dependencies:
      - target: Haluowode
      - package: HaluowodeCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
