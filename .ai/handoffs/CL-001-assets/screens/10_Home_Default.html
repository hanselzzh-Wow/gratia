<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>10 首页</title>
<style>
  :root{
    --ink-900:#0A0A0A; --ink-700:#3A3A3A; --ink-500:#767676; --ink-300:#B5B5B5;
    --hairline:#E6E6E6; --hairline-soft:#F0F0F0;
    --canvas:#FFFFFF; --canvas-warm:#FEFCF9;
    --accent:#2F6FE0; --accent-soft:#EAF1FC; --gold:#B9791F;
    --radius-md:12px; --radius-lg:16px; --radius-pill:999px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; padding:0;}
  body{width:393px; height:852px; font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif; overflow:hidden;}
  .screen{width:393px; height:852px; position:relative; background:var(--canvas-warm); display:flex; flex-direction:column;}
  .statusbar{height:47px; flex:0 0 auto; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:600; color:var(--ink-900);}
  .content{flex:1; overflow:hidden; padding:0 20px;}

  .topbar{display:flex; align-items:center; justify-content:space-between; padding:4px 0 14px;}
  .city-pill{display:flex; align-items:center; gap:4px; font-size:15px; font-weight:600; color:var(--ink-900);}
  .city-pill .caret{color:var(--ink-500); font-size:11px;}
  .brandmark{font-size:15px; font-weight:700; color:var(--ink-900);}
  .bell{width:32px; height:32px; border-radius:50%; background:var(--canvas); border:1px solid var(--hairline); display:flex; align-items:center; justify-content:center; font-size:14px;}

  .hero{border:1px solid var(--hairline); border-radius:var(--radius-lg); margin-bottom:16px; padding:20px; background:var(--canvas);}
  .hero h1{color:var(--ink-900); font-size:19px; font-weight:700; margin:0 0 4px; line-height:25px;}
  .hero p{color:var(--ink-500); font-size:13px; margin:0 0 14px; line-height:18px;}
  .hero .cta{display:inline-block; background:var(--ink-900); color:#fff; font-size:14px; font-weight:700; padding:10px 18px; border-radius:var(--radius-pill);}

  .entries{display:flex; gap:12px; margin-bottom:22px;}
  .entry{flex:1; border-radius:var(--radius-lg); padding:14px; display:flex; flex-direction:column; gap:2px; border:1px solid var(--hairline);}
  .entry.a{background:var(--ink-900); color:#fff; border-color:var(--ink-900);}
  .entry.b{background:var(--canvas); color:var(--ink-900);}
  .entry .t{font-size:14px; font-weight:700;}
  .entry .s{font-size:11.5px; opacity:.75;}
  .entry.a .s{color:rgba(255,255,255,.75);}
  .entry.b .s{color:var(--ink-500);}

  .section-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px;}
  .section-head h2{font-size:16px; font-weight:700; margin:0; color:var(--ink-900);}
  .section-head .more{font-size:12px; color:var(--accent); font-weight:600;}

  .wishes{display:flex; gap:12px; overflow:hidden; margin-bottom:24px;}
  .wcard{width:190px; flex:0 0 auto; background:var(--canvas); border:1px solid var(--hairline); border-radius:var(--radius-lg); padding:14px;}
  .wcard .top{display:flex; justify-content:space-between; font-size:11.5px; color:var(--ink-500); margin-bottom:8px;}
  .wcard .price{color:var(--gold); font-weight:700;}
  .wcard .tag{display:inline-block; font-size:11px; border:1px solid var(--hairline); color:var(--ink-700); padding:3px 8px; border-radius:var(--radius-pill); margin-bottom:8px;}
  .wcard .body{font-size:13px; line-height:18px; color:var(--ink-900); display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;}

  .steps{display:flex; justify-content:space-between; margin-bottom:20px;}
  .step{flex:1; text-align:center;}
  .step .n{width:26px; height:26px; border-radius:50%; border:1px solid var(--ink-900); color:var(--ink-900); font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center; margin:0 auto 6px;}
  .step .t{font-size:12px; color:var(--ink-700); font-weight:600;}

  .trust{display:flex; gap:10px; align-items:flex-start; border:1px solid var(--hairline); border-radius:var(--radius-md); padding:12px 14px; margin-bottom:16px; background:var(--canvas);}
  .trust .t{font-size:12px; line-height:17px; color:var(--ink-700);}

  .tabbar{flex:0 0 auto; display:flex; padding:8px 4px 26px; background:#fff; border-top:1px solid var(--hairline);}
  .tabbar .item{flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; font-size:10.5px; color:var(--ink-300); font-weight:500;}
  .tabbar .item .ic{width:24px; height:24px; border-radius:7px; background:currentColor; opacity:.18;}
  .tabbar .item.active{color:var(--ink-900); font-weight:700;}
  .tabbar .item.active .ic{opacity:1; background:var(--ink-900);}
  .tabbar .item.publish .ic{opacity:1; background:var(--ink-900); width:30px; height:30px; margin-top:-9px;}
</style>
</head>
<body>
  <div class="screen">
    <div class="statusbar">9:41</div>
    <div class="content">
      <div class="topbar">
        <div class="city-pill">上海 <span class="caret">▾</span></div>
        <div class="brandmark">哈喽卧得</div>
        <div class="bell">🔔</div>
      </div>

      <div class="hero">
        <h1>把想说的话，交给恰好在场的人</h1>
        <p>人工审核 · 真实响应 · 过程可追踪</p>
        <div class="cta">发布一个心愿</div>
      </div>

      <div class="entries">
        <div class="entry a"><div class="t">我要发布 →</div><div class="s">许一个小心愿</div></div>
        <div class="entry b"><div class="t">我刚好在这里</div><div class="s">帮别人完成心愿</div></div>
      </div>

      <div class="section-head"><h2>附近正在等待的心愿</h2><span class="more">查看全部 ›</span></div>
      <div class="wishes">
        <div class="wcard">
          <div class="top"><span>外滩</span><span class="price">¥18</span></div>
          <span class="tag">生日祝福</span>
          <div class="body">想请路过的朋友对着夜景说一句生日快乐，给远方的她一个惊喜。</div>
        </div>
        <div class="wcard">
          <div class="top"><span>东方明珠</span><span class="price">¥12</span></div>
          <span class="tag">加油鼓励</span>
          <div class="body">帮我在塔下录一段"你可以的"，明天她要参加一场重要考试。</div>
        </div>
      </div>

      <div class="section-head"><h2>如何完成一个心愿</h2></div>
      <div class="steps">
        <div class="step"><div class="n">1</div><div class="t">发布心愿</div></div>
        <div class="step"><div class="n">2</div><div class="t">人工匹配</div></div>
        <div class="step"><div class="n">3</div><div class="t">现场交付</div></div>
      </div>

      <div class="trust"><span>🔒</span><div class="t"><b>联系方式不公开，内容先审核后发布。</b>遇到问题可随时联系客服。</div></div>
    </div>

    <div class="tabbar">
      <div class="item active"><div class="ic"></div>首页</div>
      <div class="item"><div class="ic"></div>附近</div>
      <div class="item publish"><div class="ic"></div>发布</div>
      <div class="item"><div class="ic"></div>进度</div>
      <div class="item"><div class="ic"></div>我的</div>
    </div>
  </div>
</body>
</html>
