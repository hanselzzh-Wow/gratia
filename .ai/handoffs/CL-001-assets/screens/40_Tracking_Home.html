<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>40 进度首页</title>
<style>
  :root{
    --ink-900:#0A0A0A; --ink-700:#3A3A3A; --ink-500:#767676; --ink-300:#B5B5B5;
    --hairline:#E6E6E6; --canvas:#FFFFFF; --canvas-warm:#FEFCF9; --accent:#2F6FE0;
    --radius-sm:8px; --radius-md:12px; --radius-lg:16px; --radius-pill:999px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; padding:0;}
  body{width:393px; height:852px; font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif; overflow:hidden;}
  .screen{width:393px; height:852px; position:relative; background:var(--canvas-warm); display:flex; flex-direction:column;}
  .statusbar{height:47px; flex:0 0 auto; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:600; color:var(--ink-900);}
  .content{flex:1; overflow:hidden; padding:0 20px;}

  h1{font-size:26px; font-weight:700; margin:6px 0 14px; color:var(--ink-900);}

  .hint-card{display:flex; gap:10px; border:1px solid var(--hairline); border-radius:var(--radius-lg); padding:14px; margin-bottom:20px; background:var(--canvas);}
  .hint-card .t{font-size:12.5px; line-height:18px; color:var(--ink-700);}

  .field{margin-bottom:16px;}
  .field label{display:block; font-size:13px; font-weight:700; margin-bottom:8px; color:var(--ink-700);}
  .input{width:100%; font-size:15px; padding:13px 14px; border-radius:var(--radius-sm); border:1px solid var(--hairline); background:var(--canvas); color:var(--ink-300); font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
  .input.filled{color:var(--ink-900); font-family:inherit;}

  .btn{width:100%; text-align:center; font-size:16px; font-weight:700; padding:15px; border-radius:var(--radius-pill); background:var(--ink-900); color:#fff; margin:6px 0 26px;}

  .section-head{font-size:14px; font-weight:700; color:var(--ink-900); margin-bottom:12px;}
  .empty{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; text-align:center; padding:32px 16px; border:1px dashed var(--hairline); border-radius:var(--radius-lg);}
  .empty .ic{font-size:22px;}
  .empty .t1{font-size:13.5px; font-weight:600; color:var(--ink-700);}
  .empty .t2{font-size:12px; color:var(--ink-500);}

  .help-link{display:block; text-align:center; font-size:12.5px; color:var(--accent); font-weight:600; margin-top:22px;}

  .tabbar{flex:0 0 auto; display:flex; padding:10px 4px 26px; background:#fff; border-top:1px solid var(--hairline);}
  .tabbar .item{flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; font-size:10.5px; color:var(--ink-300); font-weight:500;}
  .tabbar .item .ic{width:24px; height:24px; border-radius:7px; background:currentColor; opacity:.18;}
  .tabbar .item.active{color:var(--ink-900); font-weight:700;}
  .tabbar .item.active .ic{opacity:1; background:var(--ink-900);}
  .tabbar .item.publish .ic{opacity:1; background:var(--ink-900); width:30px; height:30px; margin-top:-10px;}
</style>
</head>
<body>
  <div class="screen">
    <div class="statusbar">9:41</div>
    <div class="content">
      <h1>心愿进度</h1>

      <div class="hint-card"><span>💡</span><div class="t">公开编号可在<b>发布成功页</b>找到，格式类似 <code>HW260717-ABCDE</code>。</div></div>

      <div class="field">
        <label>公开编号</label>
        <div class="input">HW260717-ABCDE</div>
      </div>
      <div class="field">
        <label>发布时留的联系方式</label>
        <div class="input">发布时填写的微信或手机号</div>
      </div>

      <div class="btn">查询进度</div>

      <div class="section-head">最近查询</div>
      <div class="empty">
        <div class="ic">🕊️</div>
        <div class="t1">还没有查询记录</div>
        <div class="t2">查询过的心愿会显示在这里，方便下次快速查看</div>
      </div>

      <div class="help-link">编号找不到？›</div>
    </div>

    <div class="tabbar">
      <div class="item"><div class="ic"></div>首页</div>
      <div class="item"><div class="ic"></div>附近</div>
      <div class="item publish"><div class="ic"></div>发布</div>
      <div class="item active"><div class="ic"></div>进度</div>
      <div class="item"><div class="ic"></div>我的</div>
    </div>
  </div>
</body>
</html>
