<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>40 进度首页</title>
<style>
  :root{
    --ink-900:#0A0A0A; --ink-700:#42403C; --ink-500:#7A756D; --ink-300:#B8B2A8;
    --hairline:#EDE7DD; --canvas:#FFFFFF; --canvas-warm:#FBF7F0;
    --radius-sm:10px; --radius-md:14px; --radius-lg:22px; --radius-pill:999px;
    --shadow-card:0 6px 20px rgba(30,22,10,.06), 0 1px 2px rgba(30,22,10,.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0; padding:0;}
  body{width:393px; height:852px; font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif; overflow:hidden;}
  .screen{width:393px; height:852px; position:relative; background:var(--canvas-warm); display:flex; flex-direction:column;}
  .statusbar{height:47px; flex:0 0 auto; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:600; color:var(--ink-900);}
  .content{flex:1; overflow:hidden; padding:0 20px;}

  h1{font-size:26px; font-weight:600; margin:2px 0 14px; color:var(--ink-900);}

  .info{display:flex; gap:10px; background:var(--canvas); box-shadow:var(--shadow-card); border-radius:var(--radius-md); padding:13px 14px; margin-bottom:18px; font-size:12.5px; line-height:18px; color:var(--ink-700);}
  .info svg{width:16px; height:16px; color:var(--ink-500); flex:0 0 auto; margin-top:1px;}

  .field{margin-bottom:14px;}
  .field label{display:block; font-size:13px; font-weight:700; margin-bottom:8px; color:var(--ink-700);}
  .input{width:100%; font-size:16px; padding:13px 14px; border-radius:var(--radius-sm); border:1px solid var(--hairline); background:var(--canvas); color:var(--ink-300);}

  .btn-primary{width:100%; text-align:center; background:var(--ink-900); color:#fff; font-size:16px; font-weight:600; padding:14px; border-radius:var(--radius-pill); margin:8px 0 26px;}

  .recent-title{font-size:13px; font-weight:700; color:var(--ink-900); margin-bottom:10px;}
  .empty{background:var(--canvas); box-shadow:var(--shadow-card); border-radius:var(--radius-lg); padding:28px 16px; text-align:center; color:var(--ink-500); font-size:13px; margin-bottom:16px;}
  .help-link{text-align:center; font-size:12.5px; color:#2F6FE0; font-weight:600;}

  .tabbar{flex:0 0 auto; display:flex; padding:8px 4px 26px; background:#fff; border-top:1px solid var(--hairline);}
  .tabbar .item{flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; font-size:10.5px; color:var(--ink-300); font-weight:500;}
  .tabbar .item svg{width:24px; height:24px;}
  .tabbar .item.active{color:var(--ink-900); font-weight:600;}
</style>
</head>
<body>
  <div class="screen">
    <div class="statusbar">9:41</div>
    <div class="content">
      <h1>心愿进度</h1>

      <div class="info">
        <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="11" y1="10" x2="11" y2="15"/><circle cx="11" cy="7.2" r="1" fill="currentColor" stroke="none"/></svg>
        公开编号可以在发布成功页找到，也会同步保存在"我的 · 我的发布"里（登录后）。
      </div>

      <div class="field">
        <label>公开编号</label>
        <div class="input">HW260717-ABCDE</div>
      </div>
      <div class="field">
        <label>发布时留的联系方式</label>
        <div class="input">138****1234</div>
      </div>

      <div class="btn-primary">查询进度</div>

      <div class="recent-title">最近查询</div>
      <div class="empty">还没有查询记录</div>

      <div class="help-link">编号找不到？</div>
    </div>

    <div class="tabbar">
      <div class="item">
        <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l7-6 7 6"/><path d="M6 10v8a1 1 0 0 0 1 1h3v-5h2v5h3a1 1 0 0 0 1-1v-8"/></svg>
        首页
      </div>
      <div class="item">
        <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20s6-5.7 6-10.2A6 6 0 0 0 5 9.8C5 14.3 11 20 11 20Z"/><circle cx="11" cy="9.6" r="2.1"/></svg>
        附近
      </div>
      <div class="item">
        <svg viewBox="0 0 22 22"><circle cx="11" cy="11" r="9.5" fill="currentColor"/><line x1="11" y1="6.8" x2="11" y2="15.2" stroke="#FBF7F0" stroke-width="1.7" stroke-linecap="round"/><line x1="6.8" y1="11" x2="15.2" y2="11" stroke="#FBF7F0" stroke-width="1.7" stroke-linecap="round"/></svg>
        发布
      </div>
      <div class="item active">
        <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="12" r="7.3"/><path d="M11 8.2V12l2.6 1.8"/><path d="M4.6 8.3a7.3 7.3 0 0 1 2-4.1"/></svg>
        进度
      </div>
      <div class="item">
        <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="7.8" r="3.3"/><path d="M4.3 19c1-3.7 4-5.8 6.7-5.8s5.7 2.1 6.7 5.8"/></svg>
        我的
      </div>
    </div>
  </div>
</body>
</html>
