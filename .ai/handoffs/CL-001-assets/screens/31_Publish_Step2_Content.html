<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>31 发布 · 步骤2 想让对方收到什么</title>
<style>
  :root{
    --ink-900:#0A0A0A; --ink-700:#3A3A3A; --ink-500:#767676; --ink-300:#B5B5B5;
    --hairline:#E6E6E6; --canvas:#FFFFFF; --canvas-warm:#FEFCF9; --accent-soft:#EAF1FC; --ink-900-a:#0A0A0A;
    --radius-sm:8px; --radius-md:12px; --radius-lg:14px; --radius-pill:999px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; padding:0;}
  body{width:393px; height:852px; font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif; overflow:hidden;}
  .screen{width:393px; height:852px; position:relative; background:var(--canvas-warm); display:flex; flex-direction:column;}
  .statusbar{height:47px; flex:0 0 auto; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:600; color:var(--ink-900);}
  .navbar{flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; padding:2px 20px 4px; font-size:15px; font-weight:700; color:var(--ink-900);}
  .navbar .side{width:44px; font-size:16px; color:var(--ink-700); font-weight:400;}
  .navbar .side.right{text-align:right;}

  .progress-wrap{padding:10px 20px 4px;}
  .progress-label{font-size:12px; color:var(--ink-500); margin-bottom:6px; font-weight:600;}
  .progress-bar{display:flex; gap:6px;}
  .seg{flex:1; height:3px; border-radius:2px; background:var(--hairline);}
  .seg.done{background:var(--ink-900);}

  .heading{padding:14px 20px 6px;}
  .heading h1{font-size:19px; font-weight:700; margin:0 0 4px; color:var(--ink-900);}
  .heading p{font-size:13px; color:var(--ink-500); margin:0;}

  .content{flex:1; overflow:hidden; padding:12px 20px;}
  .field{margin-bottom:18px;}
  .field label{display:flex; justify-content:space-between; font-size:13px; font-weight:700; margin-bottom:10px; color:var(--ink-700);}
  .field .count{font-weight:400; color:var(--ink-300);}

  .ta{width:100%; height:88px; font-size:15px; padding:12px 14px; border-radius:var(--radius-sm); border:1px solid var(--hairline); background:var(--canvas); color:var(--ink-900); line-height:21px;}

  .method{display:flex; flex-direction:column; gap:10px;}
  .m-card{display:flex; gap:12px; align-items:center; padding:12px 14px; border-radius:var(--radius-lg); border:1px solid var(--hairline); background:var(--canvas);}
  .m-card.active{border-color:var(--ink-900); background:var(--accent-soft); border-width:2px; padding:11px 13px;}
  .m-icon{width:36px; height:36px; border-radius:10px; background:#F0F0F0; display:flex; align-items:center; justify-content:center; font-size:16px; flex:0 0 auto;}
  .m-title{font-size:14px; font-weight:700; color:var(--ink-900);}
  .m-sub{font-size:11.5px; color:var(--ink-500);}

  .select{width:100%; font-size:16px; padding:14px; border-radius:var(--radius-sm); border:1px solid var(--hairline); background:var(--canvas); color:var(--ink-900); display:flex; justify-content:space-between; align-items:center;}

  .footer{flex:0 0 auto; display:flex; gap:12px; padding:14px 20px 22px; background:#fff; border-top:1px solid var(--hairline);}
  .btn{flex:1; text-align:center; font-size:16px; font-weight:700; padding:15px; border-radius:var(--radius-pill);}
  .btn.secondary{background:var(--canvas); border:1px solid var(--ink-900); color:var(--ink-900);}
  .btn.primary{background:var(--ink-900); color:#fff;}
</style>
</head>
<body>
  <div class="screen">
    <div class="statusbar">9:41</div>
    <div class="navbar"><span class="side">✕</span><span>发布一个心愿</span><span class="side right">帮助</span></div>

    <div class="progress-wrap">
      <div class="progress-label">步骤 2/3</div>
      <div class="progress-bar"><div class="seg done"></div><div class="seg done"></div><div class="seg"></div></div>
    </div>

    <div class="heading"><h1>想让对方收到什么</h1><p>写下你想说的话，选一种交付方式</p></div>

    <div class="content">
      <div class="field">
        <label>想说的话 <span class="count">46/120</span></label>
        <div class="ta">想请恰好在外滩的朋友，帮我对着黄浦江夜景说一句"生日快乐"，给远方的她一个惊喜。</div>
      </div>

      <div class="field">
        <label>交付方式</label>
        <div class="method">
          <div class="m-card active"><div class="m-icon">🎬</div><div><div class="m-title">口播视频</div><div class="m-sub">对镜头说一段话，20–40 秒</div></div></div>
          <div class="m-card"><div class="m-icon">🎧</div><div><div class="m-title">景色配音</div><div class="m-sub">拍摄现场画面，配一段语音</div></div></div>
          <div class="m-card"><div class="m-icon">✍️</div><div><div class="m-title">手写卡片</div><div class="m-sub">手写一张卡片并拍照</div></div></div>
        </div>
      </div>

      <div class="field">
        <label>期望完成时间</label>
        <div class="select"><span>本周内</span><span>▾</span></div>
      </div>
    </div>

    <div class="footer">
      <div class="btn secondary">返回</div>
      <div class="btn primary">继续</div>
    </div>
  </div>
</body>
</html>
