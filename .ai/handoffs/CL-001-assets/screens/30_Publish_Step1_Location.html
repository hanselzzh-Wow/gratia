<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>30 发布 · 步骤1 想送到哪里</title>
<style>
  :root{
    --ink-900:#0A0A0A; --ink-700:#42403C; --ink-500:#7A756D; --ink-300:#B8B2A8;
    --hairline:#EDE7DD; --canvas:#FFFFFF; --canvas-warm:#FBF7F0;
    --radius-sm:10px; --radius-pill:999px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; padding:0;}
  body{width:393px; height:852px; font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif; overflow:hidden;}
  .screen{width:393px; height:852px; position:relative; background:var(--canvas-warm); display:flex; flex-direction:column;}
  .statusbar{height:47px; flex:0 0 auto; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:600; color:var(--ink-900);}
  .navbar{flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; padding:2px 20px 4px; font-size:15px; font-weight:600; color:var(--ink-900);}
  .navbar .side{width:22px; height:22px; color:var(--ink-700);}
  .navbar .side svg{width:100%; height:100%;}
  .navbar .help{font-size:14px; font-weight:400; color:var(--ink-700);}

  .progress-wrap{padding:10px 20px 4px;}
  .progress-label{font-size:12px; color:var(--ink-500); margin-bottom:6px; font-weight:600;}
  .progress-bar{display:flex; gap:6px;}
  .seg{flex:1; height:3px; border-radius:2px; background:var(--hairline);}
  .seg.done{background:var(--ink-900);}

  .heading{padding:16px 20px 6px;}
  .heading h1{font-size:19px; font-weight:600; margin:0 0 4px; color:var(--ink-900);}
  .heading p{font-size:13px; color:var(--ink-500); margin:0;}

  .content{flex:1; overflow:hidden; padding:14px 20px;}
  .field{margin-bottom:22px;}
  .field label{display:block; font-size:13px; font-weight:700; margin-bottom:10px; color:var(--ink-700);}

  .chip-grid{display:flex; flex-wrap:wrap; gap:10px;}
  .scene{padding:10px 16px; border-radius:var(--radius-pill); font-size:13.5px; font-weight:600; border:1px solid var(--hairline); background:var(--canvas); color:var(--ink-700);}
  .scene.active{background:var(--ink-900); border-color:var(--ink-900); color:#fff;}

  .select, .input{width:100%; font-size:16px; padding:14px 14px; border-radius:var(--radius-sm); border:1px solid var(--hairline); background:var(--canvas); color:var(--ink-900); display:flex; justify-content:space-between; align-items:center;}
  .select svg{width:14px; height:14px; color:var(--ink-500);}
  .select .ph, .input.ph{color:var(--ink-300); font-weight:400;}

  .footer{flex:0 0 auto; display:flex; gap:12px; padding:14px 20px 22px; background:rgba(255,255,255,.98); border-top:1px solid var(--hairline);}
  .btn{flex:1; text-align:center; font-size:16px; font-weight:600; padding:15px; border-radius:var(--radius-pill);}
  .btn.secondary{background:var(--canvas); border:1px solid var(--ink-900); color:var(--ink-900);}
  .btn.primary{background:var(--ink-900); color:#fff;}
</style>
</head>
<body>
  <div class="screen">
    <div class="statusbar">9:41</div>
    <div class="navbar">
      <span class="side"><svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="5.5" y1="5.5" x2="16.5" y2="16.5"/><line x1="16.5" y1="5.5" x2="5.5" y2="16.5"/></svg></span>
      <span>发布一个心愿</span>
      <span class="help">帮助</span>
    </div>

    <div class="progress-wrap">
      <div class="progress-label">步骤 1/3</div>
      <div class="progress-bar"><div class="seg done"></div><div class="seg"></div><div class="seg"></div></div>
    </div>

    <div class="heading"><h1>想送到哪里</h1><p>告诉我们这份心意发生在什么场景、什么城市</p></div>

    <div class="content">
      <div class="field">
        <label>心愿场景</label>
        <div class="chip-grid">
          <span class="scene active">生日祝福</span>
          <span class="scene">加油鼓励</span>
          <span class="scene">毕业祝福</span>
          <span class="scene">浪漫表白</span>
          <span class="scene">节日问候</span>
        </div>
      </div>

      <div class="field">
        <label>城市</label>
        <div class="select"><span>上海</span><svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 8.5l5.5 5.5 5.5-5.5"/></svg></div>
      </div>

      <div class="field">
        <label>地标</label>
        <div class="input ph">例如：外滩、东方明珠、豫园</div>
      </div>
    </div>

    <div class="footer">
      <div class="btn secondary">返回</div>
      <div class="btn primary">继续</div>
    </div>
  </div>
</body>
</html>
