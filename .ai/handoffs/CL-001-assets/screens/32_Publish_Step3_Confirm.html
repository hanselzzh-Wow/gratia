<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>32 发布 · 步骤3 确认与联系</title>
<style>
  :root{
    --ink-900:#0A0A0A; --ink-700:#42403C; --ink-500:#7A756D; --ink-300:#B8B2A8;
    --hairline:#EDE7DD; --canvas:#FFFFFF; --canvas-warm:#FBF7F0;
    --accent-soft:#EAF1FC;
    --radius-sm:10px; --radius-md:14px; --radius-lg:16px; --radius-pill:999px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; padding:0;}
  body{width:393px; height:852px; font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif; overflow:hidden;}
  .screen{width:393px; height:852px; position:relative; background:var(--canvas-warm); display:flex; flex-direction:column;}
  .statusbar{height:47px; flex:0 0 auto; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:600; color:var(--ink-900);}
  .navbar{flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; padding:2px 20px 4px; font-size:15px; font-weight:600; color:var(--ink-900);}
  .navbar .side{width:22px; height:22px; color:var(--ink-700);}
  .navbar .side svg{width:100%; height:100%;}
  .navbar .help{font-size:14px; font-weight:400; color:var(--ink-700);}

  .progress-wrap{padding:10px 20px 4px;}
  .progress-label{font-size:12px; color:var(--ink-500); margin-bottom:6px; font-weight:600;}
  .progress-bar{display:flex; gap:6px;}
  .seg{flex:1; height:3px; border-radius:2px; background:var(--hairline);}
  .seg.done{background:var(--ink-900);}

  .heading{padding:12px 20px 4px;}
  .heading h1{font-size:19px; font-weight:600; margin:0 0 4px; color:var(--ink-900);}
  .heading p{font-size:13px; color:var(--ink-500); margin:0;}

  .content{flex:1; overflow:hidden; padding:10px 20px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12.5px; font-weight:700; margin-bottom:8px; color:var(--ink-700);}

  .amounts{display:flex; gap:8px;}
  .amt{flex:1; text-align:center; padding:12px 6px; border-radius:var(--radius-md); border:1px solid var(--hairline); font-size:15px; font-weight:700; color:var(--ink-900);}
  .amt.active{border:2px solid #2F6FE0; background:var(--accent-soft); padding:11px 5px;}

  .input{width:100%; font-size:15px; padding:12px 13px; border-radius:var(--radius-sm); border:1px solid var(--hairline); background:var(--canvas); color:var(--ink-900);}
  .help{font-size:11px; color:var(--ink-500); margin-top:5px;}

  .agree{display:flex; align-items:flex-start; gap:8px; font-size:11.5px; color:var(--ink-700); line-height:16px; margin-bottom:14px;}
  .agree .box{width:16px; height:16px; border-radius:5px; border:1px solid var(--ink-900); background:var(--ink-900); flex:0 0 auto; margin-top:1px;}

  .summary{border:1px solid var(--hairline); border-radius:var(--radius-lg); padding:12px 14px; margin-bottom:6px;}
  .summary .row{display:flex; justify-content:space-between; font-size:12.5px; color:var(--ink-700); padding:5px 0;}
  .summary .row b{color:var(--ink-900); font-weight:600;}

  .footer{flex:0 0 auto; display:flex; gap:12px; padding:12px 20px 20px; background:rgba(255,255,255,.98); border-top:1px solid var(--hairline);}
  .btn{flex:1; text-align:center; font-size:16px; font-weight:600; padding:14px; border-radius:var(--radius-pill);}
  .btn.secondary{background:var(--canvas); border:1px solid var(--ink-900); color:var(--ink-900);}
  .btn.primary{background:var(--ink-900); color:#fff;}
</style>
</head>
<body>
  <div class="screen">
    <div class="statusbar">9:41</div>
    <div class="navbar">
      <span class="side"><svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="5.5" y1="5.5" x2="16.5" y2="16.5"/><line x1="16.5" y1="5.5" x2="5.5" y2="16.5"/></svg></span>
      <span>发布一个心愿</span>
      <span class="help">帮助</span>
    </div>

    <div class="progress-wrap">
      <div class="progress-label">步骤 3/3</div>
      <div class="progress-bar"><div class="seg done"></div><div class="seg done"></div><div class="seg done"></div></div>
    </div>

    <div class="heading"><h1>确认与联系</h1><p>选择感谢金，留下联系方式</p></div>

    <div class="content">
      <div class="field">
        <label>感谢金</label>
        <div class="amounts">
          <div class="amt">¥12</div>
          <div class="amt active">¥18</div>
          <div class="amt">¥28</div>
        </div>
      </div>

      <div class="field">
        <label>发布者称呼</label>
        <div class="input">路过的旅人</div>
      </div>

      <div class="field">
        <label>微信或手机号</label>
        <div class="input">138****1234</div>
        <div class="help">仅运营可见，用于审核与匹配后联系</div>
      </div>

      <div class="agree"><div class="box"></div>我同意运营人员在匹配过程中通过以上方式联系我</div>

      <div class="summary">
        <div class="row"><span>城市 · 地标</span><b>上海 · 外滩</b></div>
        <div class="row"><span>交付方式</span><b>口播视频</b></div>
        <div class="row"><span>期望时间</span><b>本周内</b></div>
        <div class="row"><span>感谢金</span><b>¥18</b></div>
      </div>
    </div>

    <div class="footer">
      <div class="btn secondary">返回</div>
      <div class="btn primary">确认发布</div>
    </div>
  </div>
</body>
</html>
