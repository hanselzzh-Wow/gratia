<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>33 发布成功</title>
<style>
  :root{
    --ink-900:#0A0A0A; --ink-700:#3A3A3A; --ink-500:#767676; --ink-300:#B5B5B5;
    --hairline:#E6E6E6; --canvas:#FFFFFF; --canvas-warm:#FEFCF9; --accent:#2F6FE0;
    --radius-sm:8px; --radius-md:12px; --radius-lg:16px; --radius-pill:999px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; padding:0;}
  body{width:393px; height:852px; font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif; overflow:hidden;}
  .screen{width:393px; height:852px; position:relative; background:var(--canvas-warm); display:flex; flex-direction:column;}
  .statusbar{height:47px; flex:0 0 auto; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:600; color:var(--ink-900);}
  .content{flex:1; overflow:hidden; padding:24px 24px 0; display:flex; flex-direction:column; align-items:center;}

  .mark{width:64px; height:64px; border-radius:50%; background:var(--ink-900); display:flex; align-items:center; justify-content:center; margin:12px 0 18px;}
  .mark svg{width:28px; height:28px;}

  h1{font-size:19px; font-weight:700; margin:0 0 20px; color:var(--ink-900); text-align:center; line-height:26px;}

  .code-card{width:100%; border:1px solid var(--hairline); border-radius:var(--radius-lg); padding:18px; text-align:center; margin-bottom:14px;}
  .code-label{font-size:12px; color:var(--ink-500); margin-bottom:8px;}
  .code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:22px; font-weight:700; letter-spacing:1px; color:var(--ink-900);}

  .actions{display:flex; gap:10px; width:100%; margin-bottom:24px;}
  .a-btn{flex:1; text-align:center; font-size:13px; font-weight:600; padding:11px; border-radius:var(--radius-pill); border:1px solid var(--ink-900); color:var(--ink-900);}

  .steps6{width:100%; margin-bottom:28px;}
  .steps6-track{display:flex; align-items:center; margin-bottom:8px;}
  .s6-dot{width:10px; height:10px; border-radius:50%; background:var(--hairline); flex:0 0 auto;}
  .s6-dot.on{background:var(--ink-900);}
  .s6-line{flex:1; height:1px; background:var(--hairline);}
  .s6-labels{display:flex; justify-content:space-between; font-size:9.5px; color:var(--ink-500);}
  .s6-labels span:first-child{color:var(--ink-900); font-weight:600;}

  .footer{flex:0 0 auto; padding:14px 24px 22px; width:100%;}
  .btn{width:100%; text-align:center; font-size:16px; font-weight:700; padding:15px; border-radius:var(--radius-pill); margin-bottom:10px;}
  .btn.primary{background:var(--ink-900); color:#fff;}
  .btn.secondary{background:transparent; color:var(--ink-700);}
  .note{font-size:11px; color:var(--ink-500); text-align:center; line-height:16px;}
</style>
</head>
<body>
  <div class="screen">
    <div class="statusbar">9:41</div>
    <div class="content">
      <div class="mark"><svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <h1>心愿已送出，<br/>正在等待审核</h1>

      <div class="code-card">
        <div class="code-label">公开编号（查询进度时需要）</div>
        <div class="code">HW260717-ABCDE</div>
      </div>

      <div class="actions">
        <div class="a-btn">复制编号</div>
        <div class="a-btn">保存到照片</div>
      </div>

      <div class="steps6">
        <div class="steps6-track">
          <div class="s6-dot on"></div><div class="s6-line"></div>
          <div class="s6-dot"></div><div class="s6-line"></div>
          <div class="s6-dot"></div><div class="s6-line"></div>
          <div class="s6-dot"></div><div class="s6-line"></div>
          <div class="s6-dot"></div><div class="s6-line"></div>
          <div class="s6-dot"></div>
        </div>
        <div class="s6-labels"><span>已提交</span><span>审核中</span><span>匹配中</span><span>已接单</span><span>已交付</span><span>已完成</span></div>
      </div>
    </div>

    <div class="footer">
      <div class="btn primary">查看心愿进度</div>
      <div class="btn secondary">返回首页</div>
      <div class="note">编号和发布时留的联系方式共同用于查询，请不要公开转发</div>
    </div>
  </div>
</body>
</html>
