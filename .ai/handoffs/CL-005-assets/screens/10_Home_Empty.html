<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>CL-005 · 10 首页 · 空态（暂无可公开故事）</title>
<style>
  :root{
    --ink-900:#171310; --ink-700:#4A443C; --ink-500:#847C6F; --ink-300:#C4BBAC;
    --hairline:#E9E1D2; --hairline-strong:#D8CDB8;
    --canvas:#FFFFFF; --canvas-warm:#FBF6EC; --canvas-sunk:#F3ECDD;
    --accent:#3E6B92; --danger:#B3452F; --success:#4C7A52;
    --r-xs:6px; --r-sm:10px; --r-md:14px; --r-lg:20px; --r-pill:999px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; padding:0;}
  body{width:393px; height:852px; font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif; overflow:hidden;}
  .screen{width:393px; height:852px; position:relative; background:var(--canvas-warm); overflow:hidden;}
  .statusbar{height:47px; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:600; color:var(--ink-900);}
  .content{position:absolute; top:47px; left:0; right:0; bottom:0; overflow:hidden; padding:0 20px;}

  .topbar{display:flex; align-items:center; justify-content:space-between; padding:4px 0 14px;}
  .brandmark{font-size:17px; font-weight:700; color:var(--ink-900); letter-spacing:-0.2px;}
  .bell{width:34px; height:34px; border-radius:var(--r-pill); background:var(--canvas); border:1px solid var(--hairline); display:flex; align-items:center; justify-content:center;}
  .bell svg{width:16px; height:16px; color:var(--ink-700);}

  .empty-wrap{padding-top:96px; display:flex; flex-direction:column; align-items:center; text-align:center;}
  .empty-icon{width:64px; height:64px; border-radius:var(--r-pill); background:var(--canvas-sunk); display:flex; align-items:center; justify-content:center; margin-bottom:22px;}
  .empty-icon svg{width:28px; height:28px; color:var(--ink-500);}
  .empty-title{font-size:18px; font-weight:700; color:var(--ink-900); margin:0 0 10px; line-height:24px;}
  .empty-body{font-size:13px; line-height:19px; color:var(--ink-500); margin:0 0 32px; max-width:272px;}

  .empty-actions{width:100%; display:flex; flex-direction:column; gap:12px; margin-bottom:36px;}
  .btn-primary-full{background:var(--ink-900); color:#fff; font-size:15px; font-weight:600; padding:14px; border-radius:var(--r-md); text-align:center;}
  .btn-secondary-full{background:var(--canvas); color:var(--ink-900); border:1px solid var(--hairline); font-size:15px; font-weight:600; padding:14px; border-radius:var(--r-md); text-align:center;}

  .empty-note{display:flex; gap:10px; align-items:flex-start; background:var(--canvas-sunk); border-radius:var(--r-md); padding:13px 14px; text-align:left;}
  .empty-note svg{width:16px; height:16px; color:var(--ink-500); flex:0 0 auto; margin-top:1px;}
  .empty-note p{font-size:11.5px; line-height:16px; color:var(--ink-700); margin:0;}

  .dock-wrap{position:absolute; left:18px; right:18px; bottom:14px; height:64px; z-index:5;}
  .dock{width:100%; height:100%; border-radius:var(--r-pill); background:rgba(255,255,255,0.72); backdrop-filter:blur(20px) saturate(180%); -webkit-backdrop-filter:blur(20px) saturate(180%); border:1px solid rgba(216,205,184,0.55); display:flex; align-items:center; justify-content:space-around; padding:0 4px;}
  .dock .item{display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--ink-300); font-size:10px; font-weight:500;}
  .dock .item svg{width:22px; height:22px;}
  .dock .item.active{color:var(--ink-900); font-weight:700;}
</style>
</head>
<body>
  <div class="screen">
    <div class="statusbar">9:41</div>
    <div class="content">
      <div class="topbar">
        <div class="brandmark">哈喽卧得</div>
        <div class="bell"><svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 15V9.6a4 4 0 0 1 8 0V15l1.4 1.4H5.6L7 15Z"/><path d="M9.6 17.6a1.4 1.4 0 0 0 2.8 0"/></svg></div>
      </div>

      <div class="empty-wrap">
        <div class="empty-icon">
          <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4.5" width="12" height="9" rx="2"/><path d="M4 12.7c0 .6.5 1.1 1.1 1.1h11.8c.6 0 1.1-.5 1.1-1.1"/><path d="M4 16c0 .6.5 1.1 1.1 1.1h11.8c.6 0 1.1-.5 1.1-1.1"/></svg>
        </div>
        <p class="empty-title">还没有可公开的完成故事</p>
        <p class="empty-body">故事需要发布者在心愿完成后单独同意公开，我们正在收集第一批经过确认的案例，稍后会在这里展示。</p>

        <div class="empty-actions">
          <div class="btn-primary-full">我也想发布心愿</div>
          <div class="btn-secondary-full">去附近看看能帮什么</div>
        </div>

        <div class="empty-note">
          <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="10" width="10" height="8" rx="2"/><path d="M8.5 10V7.5a2.5 2.5 0 0 1 5 0V10"/></svg>
          <p>公开故事不显示联系方式与精确地点，随时可申请下架。</p>
        </div>
      </div>
    </div>

    <div class="dock-wrap">
      <div class="dock">
        <div class="item active">
          <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l7-6 7 6"/><path d="M6 10v8a1 1 0 0 0 1 1h3v-5h2v5h3a1 1 0 0 0 1-1v-8"/></svg>
          首页
        </div>
        <div class="item">
          <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20s6-5.7 6-10.2A6 6 0 0 0 5 9.8C5 14.3 11 20 11 20Z"/><circle cx="11" cy="9.6" r="2.1"/></svg>
          附近
        </div>
        <div class="item">
          <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="9.25"/><path d="M11 6.5v9M6.5 11h9"/></svg>
          发布
        </div>
        <div class="item">
          <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="12" r="7.3"/><path d="M11 8.2V12l2.6 1.8"/><path d="M4.6 8.3a7.3 7.3 0 0 1 2-4.1"/></svg>
          进度
        </div>
        <div class="item">
          <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="7.8" r="3.3"/><path d="M4.3 19c1-3.7 4-5.8 6.7-5.8s5.7 2.1 6.7 5.8"/></svg>
          我的
        </div>
      </div>
    </div>
  </div>
</body>
</html>
