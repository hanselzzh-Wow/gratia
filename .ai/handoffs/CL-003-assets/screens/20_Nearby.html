<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>CL-003 · 20 附近</title>
<style>
  :root{
    --ink-900:#171310; --ink-700:#4A443C; --ink-500:#847C6F; --ink-300:#C4BBAC;
    --hairline:#E9E1D2; --hairline-strong:#D8CDB8;
    --canvas:#FFFFFF; --canvas-warm:#FBF6EC; --canvas-sunk:#F3ECDD;
    --accent:#3E6B92;
    --r-xs:6px; --r-sm:10px; --r-md:14px; --r-lg:20px; --r-pill:999px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; padding:0;}
  body{width:393px; height:852px; font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif; overflow:hidden;}
  .screen{width:393px; height:852px; position:relative; background:var(--canvas-warm); display:flex; flex-direction:column;}
  .statusbar{height:47px; flex:0 0 auto; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:600; color:var(--ink-900);}
  .content{flex:1; overflow:hidden; padding:0 20px;}

  h1{font-size:26px; font-weight:700; margin:2px 0 2px; color:var(--ink-900);}
  .city{font-size:13px; color:var(--ink-500); margin:0 0 14px;}

  .search{display:flex; align-items:center; gap:8px; background:var(--canvas-sunk); border-radius:var(--r-sm); padding:12px 14px; margin-bottom:12px; font-size:14px; color:var(--ink-500);}
  .search svg{width:18px; height:18px; color:var(--ink-500);}

  .filters{display:flex; gap:8px; overflow:hidden; margin-bottom:14px;}
  .chip{flex:0 0 auto; padding:8px 15px; border-radius:var(--r-pill); font-size:12.5px; font-weight:600; border:1px solid var(--hairline-strong); background:var(--canvas); color:var(--ink-700);}
  .chip.active{background:var(--ink-900); border-color:var(--ink-900); color:#fff;}

  .meta-row{display:flex; justify-content:space-between; align-items:center; font-size:12px; color:var(--ink-500); margin-bottom:10px;}

  .list{display:flex; flex-direction:column; gap:12px;}
  .card{background:var(--canvas); border:1px solid var(--hairline); border-radius:var(--r-lg); padding:16px;}
  .card .top{display:flex; justify-content:space-between; font-size:13px; color:var(--ink-500); margin-bottom:8px;}
  .card .price{color:var(--ink-900); font-weight:700;}
  .card .tags{display:flex; gap:6px; margin-bottom:10px;}
  .tag{font-size:11px; padding:3px 9px; border-radius:var(--r-pill); border:1px solid var(--hairline-strong); color:var(--ink-700); font-weight:600;}
  .card .body{font-size:14.5px; line-height:20px; color:var(--ink-900); margin-bottom:10px; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;}
  .card .bottom{display:flex; justify-content:space-between; align-items:center; font-size:12px; color:var(--ink-500);}
  .card .bottom .link{color:var(--accent); font-weight:600;}

  .tabbar{flex:0 0 auto; display:flex; padding:8px 4px 26px; background:var(--canvas); border-top:1px solid var(--hairline);}
  .tabbar .item{flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; font-size:10.5px; color:var(--ink-300); font-weight:500;}
  .tabbar .item svg{width:24px; height:24px;}
  .tabbar .item.active{color:var(--ink-900); font-weight:600;}
</style>
</head>
<body>
  <div class="screen">
    <div class="statusbar">9:41</div>
    <div class="content">
      <h1>附近的心愿</h1>
      <div class="city">当前城市：上海</div>

      <div class="search">
        <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="9.5" cy="9.5" r="5.3"/><line x1="17" y1="17" x2="13.3" y2="13.3"/></svg>
        搜索地标或关键词
      </div>

      <div class="filters">
        <span class="chip active">全部</span>
        <span class="chip">城市</span>
        <span class="chip">交付方式</span>
        <span class="chip">期望时间</span>
        <span class="chip">感谢金</span>
      </div>

      <div class="meta-row"><span>共 12 个待响应心愿</span><span>按最新发布</span></div>

      <div class="list">
        <div class="card">
          <div class="top"><span>外滩 · 陈毅广场</span><span class="price">¥18</span></div>
          <div class="tags"><span class="tag">生日祝福</span><span class="tag">口播视频</span></div>
          <div class="body">想请恰好在外滩的朋友，帮我对着夜景说一句"生日快乐"，给远方的她一个惊喜。</div>
          <div class="bottom"><span>期望本周内完成</span><span class="link">查看详情 ›</span></div>
        </div>
        <div class="card">
          <div class="top"><span>东方明珠</span><span class="price">¥12</span></div>
          <div class="tags"><span class="tag">加油鼓励</span><span class="tag">景色配音</span></div>
          <div class="body">帮我在塔下录一段"你可以的"，明天她要参加一场重要考试，想给她加油。</div>
          <div class="bottom"><span>期望 24 小时内</span><span class="link">查看详情 ›</span></div>
        </div>
        <div class="card">
          <div class="top"><span>豫园</span><span class="price">¥28</span></div>
          <div class="tags"><span class="tag">毕业祝福</span><span class="tag">手写卡片</span></div>
          <div class="body">想请路过的朋友帮忙写一张手写卡片，祝我表妹毕业快乐，字迹工整就好。</div>
          <div class="bottom"><span>期望本周内完成</span><span class="link">查看详情 ›</span></div>
        </div>
      </div>
    </div>

    <div class="tabbar">
      <div class="item">
        <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l7-6 7 6"/><path d="M6 10v8a1 1 0 0 0 1 1h3v-5h2v5h3a1 1 0 0 0 1-1v-8"/></svg>
        首页
      </div>
      <div class="item active">
        <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20s6-5.7 6-10.2A6 6 0 0 0 5 9.8C5 14.3 11 20 11 20Z"/><circle cx="11" cy="9.6" r="2.1"/></svg>
        附近
      </div>
      <div class="item">
        <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="9.25"/><path d="M11 6.5v9M6.5 11h9"/></svg>
        发布
      </div>
      <div class="item">
        <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="12" r="7.3"/><path d="M11 8.2V12l2.6 1.8"/><path d="M4.6 8.3a7.3 7.3 0 0 1 2-4.1"/></svg>
        进度
      </div>
      <div class="item">
        <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="7.8" r="3.3"/><path d="M4.3 19c1-3.7 4-5.8 6.7-5.8s5.7 2.1 6.7 5.8"/></svg>
        我的
      </div>
    </div>
  </div>
</body>
</html>
