<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>24 响应成功</title>
<style>
  :root{
    --ink-900:#0A0A0A; --ink-700:#42403C; --ink-500:#7A756D;
    --hairline:#EDE7DD; --canvas:#FFFFFF; --canvas-warm:#FBF7F0; --gold:#B9791F;
    --radius-md:14px; --radius-lg:22px; --radius-pill:999px;
    --shadow-card:0 6px 20px rgba(30,22,10,.06), 0 1px 2px rgba(30,22,10,.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0; padding:0;}
  body{width:393px; height:852px; font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif; overflow:hidden;}
  .screen{width:393px; height:852px; position:relative; background:var(--canvas-warm); display:flex; flex-direction:column;}
  .statusbar{height:47px; flex:0 0 auto; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:600; color:var(--ink-900);}
  .content{flex:1; overflow:hidden; padding:20px 24px 0; display:flex; flex-direction:column; align-items:center;}

  .mark{width:64px; height:64px; border-radius:50%; background:var(--ink-900); display:flex; align-items:center; justify-content:center; margin:16px 0 18px;}

  h1{font-size:20px; font-weight:600; margin:0 0 8px; color:var(--ink-900); text-align:center;}
  .sub{font-size:13.5px; color:var(--ink-500); text-align:center; line-height:20px; margin:0 0 24px; max-width:300px;}

  .summary{width:100%; background:var(--canvas); border-radius:var(--radius-lg); box-shadow:var(--shadow-card); padding:18px; margin-bottom:28px;}
  .summary .top{display:flex; justify-content:space-between; font-size:13px; color:var(--ink-500); margin-bottom:8px;}
  .summary .price{color:var(--gold); font-weight:700;}
  .summary .title{font-size:15px; font-weight:600; color:var(--ink-900); margin-bottom:6px;}
  .summary .body{font-size:13.5px; color:var(--ink-700); line-height:19px;}

  .footer{flex:0 0 auto; padding:0 24px 22px; width:100%;}
  .btn{width:100%; text-align:center; font-size:16px; font-weight:600; padding:15px; border-radius:var(--radius-pill); margin-bottom:10px;}
  .btn.primary{background:var(--ink-900); color:#fff;}
  .btn.secondary{background:transparent; color:var(--ink-700);}
</style>
</head>
<body>
  <div class="screen">
    <div class="statusbar">9:41</div>
    <div class="content">
      <div class="mark"><svg width="26" height="26" viewBox="0 0 22 22" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 11.5l4 4 8-8.5"/></svg></div>
      <h1>已收到你的响应</h1>
      <p class="sub">运营人员确认后会联系你，这还不代表已经接单。请留意消息通知。</p>

      <div class="summary">
        <div class="top"><span>上海 · 外滩</span><span class="price">¥18</span></div>
        <div class="title">对着外滩夜景，说一句生日快乐</div>
        <div class="body">口播视频 · 期望本周内完成</div>
      </div>
    </div>

    <div class="footer">
      <div class="btn primary">继续看看</div>
      <div class="btn secondary">返回首页</div>
    </div>
  </div>
</body>
</html>
