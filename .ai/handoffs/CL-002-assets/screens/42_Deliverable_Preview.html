<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>42 交付预览</title>
<style>
  :root{
    --radius-pill:999px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; padding:0; background:#F1EDE4;}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;}
  .board{display:flex; gap:24px; padding:24px; align-items:flex-start;}
  .col{text-align:center;}
  .col .label{margin:10px 0 0; font-size:12px; color:#7A756D; font-weight:600; max-width:393px;}

  .screen{width:393px; height:852px; position:relative; background:#0A0A0A; overflow:hidden; color:#fff;}
  .topbar{position:absolute; top:0; left:0; right:0; padding:52px 16px 12px; display:flex; align-items:center; justify-content:space-between; background:rgba(0,0,0,.5); z-index:2;}
  .topbar .code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; color:#DADADA;}
  .icbtn{width:32px; height:32px; border-radius:50%; background:rgba(255,255,255,.14); display:flex; align-items:center; justify-content:center;}
  .icbtn svg{width:16px; height:16px;}

  .media{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;}
  .media.img{background:#2A2A2A;}
  .media.vid{background:#141414;}

  .play{width:64px; height:64px; border-radius:50%; background:rgba(255,255,255,.16); display:flex; align-items:center; justify-content:center;}
  .play svg{width:24px; height:24px; margin-left:3px;}

  .bottom{position:absolute; left:0; right:0; bottom:0; padding:16px 18px 26px; background:rgba(0,0,0,.55); z-index:2;}
  .bottom .note{font-size:14px; line-height:20px; margin-bottom:6px;}
  .bottom .meta{font-size:11.5px; color:#C7C7C7;}
  .bottom .flag{margin-top:10px; font-size:12px; color:#EDEDED; text-decoration:underline; opacity:.85;}

  .center{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;}
  .spinner{width:28px; height:28px; border-radius:50%; border:3px solid rgba(255,255,255,.25); border-top-color:#fff; animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .fail-icon{width:32px; height:32px; color:#9A9A9A;}
  .fail-text{font-size:14px; color:#DADADA;}
  .retry{margin-top:4px; font-size:13px; font-weight:600; color:#0A0A0A; background:#fff; padding:9px 20px; border-radius:var(--radius-pill);}
</style>
</head>
<body>
